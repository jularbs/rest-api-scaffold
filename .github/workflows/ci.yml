name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_ENV: test
  PORT: 3000
  CORS_ORIGIN: http://localhost:3001
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/starcity_test?sslmode=disable
  DATABASE_MIGRATIONS_DIR: ./db/main/migrations
  AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/starcity_audit?sslmode=disable
  AUDIT_DATABASE_MIGRATIONS_DIR: ./db/audit/migrations
  JWT_ACCESS_SECRET: local-access-secret
  JWT_REFRESH_SECRET: local-refresh-secret
  JWT_ACCESS_EXPIRES_IN_MINUTES: 15
  JWT_REFRESH_EXPIRES_IN_DAYS: 7
  LOG_LEVEL: info
  COOKIE_SECURE: false

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: starcity_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d starcity_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      postgres_audit:
        image: postgres:16
        env:
          POSTGRES_DB: starcity_audit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5433
        options: >-
          --health-cmd="pg_isready -U postgres -d starcity_audit"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Create .env for integration tests
        run: |
          cat > .env <<'EOF'
          NODE_ENV=${NODE_ENV}
          PORT=${PORT}
          CORS_ORIGIN=${CORS_ORIGIN}
          DATABASE_URL=${DATABASE_URL}
          DATABASE_MIGRATIONS_DIR=${DATABASE_MIGRATIONS_DIR}
          AUDIT_DATABASE_URL=${AUDIT_DATABASE_URL}
          AUDIT_DATABASE_MIGRATIONS_DIR=${AUDIT_DATABASE_MIGRATIONS_DIR}
          JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          JWT_ACCESS_EXPIRES_IN_MINUTES=${JWT_ACCESS_EXPIRES_IN_MINUTES}
          JWT_REFRESH_EXPIRES_IN_DAYS=${JWT_REFRESH_EXPIRES_IN_DAYS}
          LOG_LEVEL=${LOG_LEVEL}
          COOKIE_SECURE=${COOKIE_SECURE}
          EOF

      - name: Run test DB migrations
        run: pnpm db:migrate

      - name: Run audit DB migrations
        run: pnpm audit:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
